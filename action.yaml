name: environment-variables
description: "Github Action to set environment variables"
inputs:
  environment-name:
    description: "Environment name"
    required: true
  environment-file-path:
    description: "Path where the environment files are stored"
    default: .github/workflows/env
  artifact-name:
    description: "Artifact name to be downloaded."
    required: false
runs:
  using: "composite"
  steps:
    - name: Download Artifact
      if: ${{ inputs.artifact-name }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
    - name: Set environment variables
      shell: bash
      run: |
        if [ ! -f ${{ inputs.environment-file-path }}/${{ inputs.environment-name }}.env ]
        then
           echo "ERROR environment file ${{ inputs.environment-file-path }}/${{ inputs.environment-name }}.env does not exist."
           exit 1
        fi
        echo "Exporting environment specific variables:"
        echo "###########################################"
        while read -r line || [ -n "$line" ]
        do
          envVar=$(echo "$line" | envsubst)
          echo "$envVar" >> $GITHUB_ENV
          echo "$envVar"
          export "$envVar"
        done < <(cat ${{ inputs.environment-file-path }}/${{ inputs.environment-name }}.env | sed '/^\(#\|[[:space:]]*$\)/d;s/#.*//g')
        echo "###########################################"
